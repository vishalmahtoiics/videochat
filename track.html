<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live location map</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      #map {
        height: 70vh;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .track-wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Live location</h1>
    </header>

    <section class="track-wrap">
      <div class="status-bar">
        <span id="key-label" class="room-label"></span>
        <span id="track-state" class="badge badge-wait">Waiting for location…</span>
      </div>
      <div id="map"></div>
      <p id="updated" class="privacy-note"></p>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="track.js"></script>
  </body>
</html>
